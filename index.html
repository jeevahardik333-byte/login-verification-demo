<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Verification Demo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#101827,#253b58);min-height:100vh;display:grid;place-items:center;color:#182235;padding:20px}
.card{background:white;width:min(430px,100%);padding:30px;border-radius:18px;box-shadow:0 18px 55px #0005}h1{margin:0 0 8px;font-size:25px}.muted{color:#64748b;line-height:1.5}.notice{background:#fff7df;border:1px solid #f2d58a;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;margin:18px 0}
label{display:block;font-size:14px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
button{width:100%;border:0;background:#2457d6;color:white;padding:14px;border-radius:9px;font-weight:700;font-size:15px;margin-top:17px;cursor:pointer}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;margin-top:16px}.check input{width:auto;margin-top:2px}.status{margin-top:15px;font-size:14px;line-height:1.5}
</style></head><body><main class="card">
<h1>Login Verification Demo</h1><p class="muted">Educational cybersecurity demonstration</p>
<div class="notice"><b>Privacy notice:</b> This demo records only the demo user ID you choose to submit, after you give consent. Do not enter a real account ID or password. No password field is provided or collected.</div>
<form id="demoForm">
<label for="userId">Demo User ID</label><input id="userId" maxlength="100" placeholder="e.g. student-demo-01" required>
<label class="check"><input id="consent" type="checkbox" required><span>I understand this is a demo and agree to submit the demo ID above to the project dashboard.</span></label>
<button type="submit">Submit Demo Verification</button>
</form><div class="status" id="status" role="status"></div>
</main><script>
document.getElementById('demoForm').addEventListener('submit',async e=>{
 e.preventDefault();const status=document.getElementById('status');status.textContent='Submitting…';
 try{const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:document.getElementById('userId').value,consent:document.getElementById('consent').checked})});
 const data=await r.json();if(!r.ok)throw new Error(data.error||'Submission failed');status.textContent=data.message;e.target.reset();
 }catch(err){status.textContent=err.message+' — please try again.';}
});
</script></body></html>
